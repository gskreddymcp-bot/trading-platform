services:
  backend:
    build:
      context: ./backend
    container_name: mios-v1-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://mios:mios@db:5432/mios
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
    container_name: mios-v1-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    container_name: mios-v1-db
    environment:
      POSTGRES_USER: mios
      POSTGRES_PASSWORD: mios
      POSTGRES_DB: mios
    ports:
      - "5432:5432"
    volumes:
      - mios_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mios-v1-redis
    ports:
      - "6379:6379"

volumes:
  mios_pgdata:
